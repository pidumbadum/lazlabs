name: Tests

on:
  push:
    branches: [main, ci/*, refactor/*, test/*, build/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest  # GitHub запустит этот код на свежем Linux

    steps:
      # 1. Скачиваем ваш код из репозитория
      - uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Используем 3.10, так как на WSL у вас она

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e packages/core

      # 4. Запускаем тесты
      - name: Run tests
        run: |
          pytest tests/ -v