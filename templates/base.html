<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Система обучения</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <span class="brand">📚 Lazlabs</span>
            {% if user %}
            <div class="user-info">
                <span>{{ user.role|capitalize }}</span>
                <a href="/logout" class="btn-outline">Выйти</a>
            </div>
            {% endif %}
        </div>
    </nav>
    <main>{% block content %}{% endblock %}</main>
    <script src="../static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
