{% extends "base.html" %}
{% block content %}
<div class="dashboard">
    <div class="tabs">
        <button class="tab active" data-tab="schedule">Расписание</button>
        <button class="tab" data-tab="tasks">Задания</button>
    </div>
    <div id="schedule" class="panel active">
        <h3>Расписание на неделю</h3>
        <table id="sched-table"><thead><tr><th>Дата</th><th>Время</th><th>Предмет</th></tr></thead><tbody></tbody></table>
    </div>
    <div id="tasks" class="panel">
        <h3>Мои задания</h3>
        <table id="tasks-table"><thead><tr><th>Предмет</th><th>Название</th><th>Дедлайн</th><th>Статус</th><th>Баллы</th><th>Сдача</th></tr></thead><tbody></tbody></table>
    </div>
</div>

{% endblock %}
